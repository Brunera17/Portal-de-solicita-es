# Integração contínua: a cada push/PR valida backend, frontend e a subida completa via Docker.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_teste?schema=public
      TEST_DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_teste?schema=public
      JWT_SECRET: segredo-usado-apenas-no-ci-123456
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker Compose (subida completa + teste de fumaça)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build e subida (aguarda os healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Teste de fumaça pela interface (Nginx → API → banco)
        run: |
          set -e
          base=http://localhost:8080
          curl -fsS "$base/" | grep -q '<div id="root">'
          curl -fsS "$base/solicitacoes/1" | grep -q '<div id="root">'   # fallback de SPA
          curl -fsS "$base/api/health" | grep -q '"database":"ok"'
          token=$(curl -fsS -X POST "$base/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"usuario":"gerente","senha":"gerente123"}' | jq -r .token)
          total=$(curl -fsS "$base/api/solicitacoes" -H "Authorization: Bearer $token" | jq .paginacao.total)
          echo "Solicitações de demonstração: $total"
          test "$total" -eq 15

      - name: Reinício não apaga dados (seed só em banco vazio)
        run: |
          set -e
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 120
          docker compose logs backend | grep -q "Seed ignorado"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar
        if: always()
        run: docker compose down -v
